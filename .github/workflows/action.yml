name: build

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

jobs:
  build-job:
    name: Perl ${{ matrix.perl }} / DBI ${{ matrix.dbi }} / SQLite3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # DBI 1.611 is the supported minimum and the first stable release
          # with the casting API required by DBD::ODBC.
          - perl: "5.16"
            dbi: "1.611"
          - perl: "5.36"
            dbi: "1.611"
          # Exercise both sides of the DBIXS_REVISION regression boundary.
          - perl: "5.38"
            dbi: "1.646"
          - perl: "5.42"
            dbi: "1.647"
          # Cover a newer fixed DBI on a newer stable Perl.
          - perl: "5.40"
            dbi: "1.648"
          - perl: "latest"
            dbi: "latest"
    env:
      DBI_DSN: dbi:ODBC:DRIVER=SQLite3
      PERL_MM_USE_DEFAULT: 1
      DBD_ODBC_UNICODE: 1
      AUTHOR_TESTING: 1
    steps:
      - uses: actions/checkout@v4
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
      - run: sudo apt-get update -y
      - run: sudo apt-get install -y unixodbc unixodbc-dev libsqliteodbc
      - run: perl -V
      - name: Install DBI ${{ matrix.dbi }} and test dependencies
        run: |
          if [ "${{ matrix.dbi }}" = latest ]; then
            cpanm DBI
          else
            # Old DBI distributions have test-suite failures on current
            # runners. DBD::ODBC's suite is the compatibility test here.
            cpanm --notest "DBI@${{ matrix.dbi }}"
          fi
          cpanm Test::Output Test::Pod Test::Pod::Coverage Test::Kwalitee
      - run: perl Makefile.PL && make && make test
